<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile 작성</title>
</head>

<body>

    <h2 align="center">Profile 작성</h2>

    <form>

        이름 :
        <input type="text"
               name="name"
               size="15"
               maxlength="10">

        <br><br>

        생년월일 :
        <input type="date"
               name="birth">

        <br><br>

        키 :
        <input type="number"
               name="height"
               min="130"
               max="190"> cm

        <br><br>

        몸무게 :
        <input type="number"
               name="weight"
               min="30"
               max="100"> kg

        <br><br>

        <input type="submit"
               value="작성 완료">

        <input type="reset"
               value="다시 작성">

    </form>

</body>

</html>
